name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tokens:
    name: Tokens em dia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Tanto o Dart gerado quanto a entrada que o gerou
      # (tool/ds-core-snapshot/) são commitados, então este passo roda offline —
      # sem depender do repo web nem de pacote publicado.
      #
      # Ele existe para que ninguém edite o gerado à mão: divergiu do snapshot,
      # o build falha aqui em vez de a divergência viajar em silêncio até a tela.
      # Atualizar tokens é `npm run core:sync && npm run tokens:gen`, que mexe
      # nos dois lados de uma vez.
      - name: Falha se os tokens estiverem defasados
        run: npm run tokens:check

  flutter:
    name: Analyze e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
        working-directory: packages/nortear_ds
      - run: flutter analyze
        working-directory: packages/nortear_ds
      - run: flutter test
        working-directory: packages/nortear_ds

      - run: flutter pub get
        working-directory: packages/nortear_ds_widgetbook
      - name: Codegen do Widgetbook
        run: dart run build_runner build
        working-directory: packages/nortear_ds_widgetbook
      - run: flutter analyze
        working-directory: packages/nortear_ds_widgetbook

  widgetbook-cloud:
    name: Publica no Widgetbook Cloud
    runs-on: ubuntu-latest
    needs: flutter
    # O Cloud compara o build do PR com o da base — sem o histórico ele não
    # tem com o que comparar e o review visual vem vazio.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
        working-directory: packages/nortear_ds_widgetbook
      - run: dart run build_runner build
        working-directory: packages/nortear_ds_widgetbook
      - run: flutter build web --release
        working-directory: packages/nortear_ds_widgetbook

      # `dart run <pacote>:<executável>` — o executável do widgetbook_cli se
      # chama `widgetbook`, não `widgetbook_cli`, então a forma com dois-pontos
      # é obrigatória.
      #
      # `--path` é a pasta que CONTÉM `build/`, não o `build/web`. Como o
      # working-directory já é a raiz do pacote, o default `./` serve.
      - name: Push
        run: dart run widgetbook_cli:widgetbook cloud build push --api-key "$WIDGETBOOK_API_KEY"
        working-directory: packages/nortear_ds_widgetbook
        env:
          WIDGETBOOK_API_KEY: ${{ secrets.WIDGETBOOK_API_KEY }}
