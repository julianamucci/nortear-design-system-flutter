name: nortear_ds
description: Nortear Design System para Flutter — tokens, tema e componentes nativos.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

# Sem `widgetbook` aqui, de propósito. O workbench é dev-only e vive em
# packages/nortear_ds_widgetbook — se entrasse neste pubspec, entraria também no
# grafo de dependências de todo app que consome o design system.
flutter:
  uses-material-design: true
