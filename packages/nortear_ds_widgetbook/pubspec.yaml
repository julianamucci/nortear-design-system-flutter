name: nortear_ds_widgetbook
description: Workbench do Nortear DS — use cases, knobs e addons. Não publicado.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

# Os pisos abaixo são as versões que este código realmente usa, não mínimos
# otimistas. `knobs.object.dropdown` e `TextScaleAddon(min:, max:)` só existem a
# partir do widgetbook 3.25 — afrouxar o piso faria a resolução cair numa API
# que não compila.
dependencies:
  flutter:
    sdk: flutter
  nortear_ds:
    path: ../nortear_ds
  widgetbook: ^3.25.0
  widgetbook_annotation: ^3.11.0

dev_dependencies:
  build_runner: ^2.4.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  widgetbook_cli: ^3.15.0
  widgetbook_generator: ^3.24.0

flutter:
  uses-material-design: true
