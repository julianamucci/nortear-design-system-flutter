# Regras compartilhadas pelos dois pacotes. Cada um inclui ESTE arquivo e o
# flutter_lints, nesta ordem (ver packages/*/analysis_options.yaml).
#
# O `include: package:flutter_lints/flutter.yaml` morava aqui e resolvia por
# herança quando o analyzer subia a árvore a partir de um pacote — mas a raiz
# não é um pacote Dart, então abrir este arquivo sozinho no editor dava
# `include_file_not_found` permanente. Aviso fixo no painel de Problems ensina
# a ignorar o painel.

analyzer:
  exclude:
    # Saída do build_runner do Widgetbook.
    - "**/*.directories.g.dart"
  errors:
    # Um token documentado que não existe manda o consumidor sobrescrever uma
    # constante inerte. Import morto é o primeiro sintoma disso.
    unused_import: error
    # O sistema tem tipos próprios para cor e dimensão; `dynamic` circulando
    # entre tema e componente apaga essa garantia.
    argument_type_not_assignable: error

linter:
  rules:
    # O que este repo cobra além do flutter_lints padrão.
    always_declare_return_types: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    require_trailing_commas: true
    sort_pub_dependencies: true
    unawaited_futures: true
    # Widget de design system sem `key` impede o consumidor de controlar
    # identidade na árvore — e quebra reordenação de lista.
    use_key_in_widget_constructors: true
